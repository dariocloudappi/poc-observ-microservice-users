server:
  port: ${PORT:8080}

spring:
  application:
    name: ${OTEL_SERVICE_NAME:MicroServiceUsers}
  datasource:
    url: jdbc:sqlserver://${SQL_SERVER};database=${SQL_DATABASE};user=${SQL_USERNAME}@${SQL_SERVER_NAME};password=${SQL_PASSWORD};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;

    username: ${SQL_USERNAME}
    password: ${SQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

app:
  security:
    username: ${BASIC_AUTH_USER}
    password: ${BASIC_AUTH_PASSWORD}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      cache:
        time-to-live: 30s
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example: ${LOG_LEVEL:INFO}
    com.example.microserviceusersapplication: ${LOG_LEVEL:INFO}
    com.example.microserviceusersapplication.config: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
    com.azure: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
