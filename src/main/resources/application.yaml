server:
  port: ${PORT:8080}

spring:
  application:
    name: ${OTEL_SERVICE_NAME:MicroServiceUsers}
  datasource:
    url: jdbc:sqlserver://${SQL_SERVER};database=${SQL_DATABASE};user=${SQL_USERNAME}@${SQL_SERVER_NAME};password=${SQL_PASSWORD};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;

    username: ${SQL_USERNAME}
    password: ${SQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    # Deliberately false: show-sql writes straight to System.out, which the OTel
    # agent does not instrument, so those lines never reach New Relic. The
    # org.hibernate.SQL logger below goes through Logback, which the agent does
    # instrument.
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

app:
  security:
    username: ${BASIC_AUTH_USER}
    password: ${BASIC_AUTH_PASSWORD}
  httpbin:
    # Destino de la llamada saliente de demostracion del endpoint /get.
    url: ${APP_HTTPBIN_URL:https://httpbin.org/get}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      cache:
        time-to-live: 30s
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example: ${LOG_LEVEL:INFO}
    com.example.microserviceusersapplication: ${LOG_LEVEL:INFO}
    com.example.microserviceusersapplication.config: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
    com.azure: WARN
    # Every statement Hibernate executes, as a log record correlated with its
    # trace. Set SQL_LOG_LEVEL=DEBUG to enable it.
    # The logger name is declared here and not as a LOGGING_LEVEL_ORG_HIBERNATE_SQL
    # app setting on purpose: relaxed binding lowercases environment variable
    # names, and "org.hibernate.sql" is a different logger than "org.hibernate.SQL".
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
    # Bind parameter values. Only useful with SQL_LOG_LEVEL=DEBUG, and it prints
    # the data sent to the database, so keep it off unless you are debugging.
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
