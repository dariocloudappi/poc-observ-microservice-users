# =============================================================================
# deploy.yml - build and deploy microservice-users to Azure App Service
# -----------------------------------------------------------------------------
# Authentication uses OIDC federated credentials: no client secret is stored
# anywhere. Sensitive values come from GitHub Secrets and reach Bicep through
# environment variables, so they never appear as command line arguments.
# =============================================================================

name: deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      auto_destroy_minutes:
        description: 'Minutes before the resource group is deleted automatically. 0 disables the automatic cleanup'
        required: false
        default: '60'
      observability_enabled:
        description: 'Attach the OpenTelemetry agent and export to New Relic'
        required: false
        default: 'true'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-microservice-users
  cancel-in-progress: false

env:
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-usersvc' }}
  POC_NAME_PREFIX: ${{ vars.POC_NAME_PREFIX || 'usersvc' }}
  POC_OWNER: ${{ vars.POC_OWNER || 'unknown' }}
  POC_TTL: ${{ vars.POC_TTL || '1h' }}
  LOG_RETENTION_DAYS: ${{ vars.LOG_RETENTION_DAYS || '30' }}
  LOG_DAILY_QUOTA_GB: ${{ vars.LOG_DAILY_QUOTA_GB || '1' }}
  ENABLE_ACTIVITY_LOG_EXPORT: ${{ vars.ENABLE_ACTIVITY_LOG_EXPORT || 'false' }}
  ENABLE_LOG_ANALYTICS: ${{ vars.ENABLE_LOG_ANALYTICS || 'true' }}
  ENABLE_SQL_AUDIT: ${{ vars.ENABLE_SQL_AUDIT || 'true' }}
  SQL_LOG_LEVEL: ${{ vars.SQL_LOG_LEVEL || 'INFO' }}
  APP_SERVICE_SKU: ${{ vars.APP_SERVICE_SKU || 'B1' }}
  SQL_SKU_NAME: ${{ vars.SQL_SKU_NAME || 'Basic' }}
  SQL_DATABASE_NAME: ${{ vars.SQL_DATABASE_NAME || 'sqldb-users' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'poc' }}
  SERVICE_NAMESPACE: ${{ vars.SERVICE_NAMESPACE || 'poc-observability' }}
  OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME || 'microservice-users' }}
  NR_OTLP_ENDPOINT: ${{ vars.NR_OTLP_ENDPOINT || 'https://otlp.eu01.nr-data.net:4318' }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}

jobs:

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Mask every secret before it can reach a log line.
      - name: Mask sensitive values
        env:
          SQL_ADMIN_USER: ${{ secrets.SQL_ADMIN_USER }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          NR_LICENSE_KEY: ${{ secrets.NR_LICENSE_KEY }}
        run: |
          for name in SQL_ADMIN_USER SQL_ADMIN_PASSWORD BASIC_AUTH_USER \
                      BASIC_AUTH_PASSWORD NR_LICENSE_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "ERROR: required secret $name is not configured in the repository" >&2
              exit 1
            fi
            echo "::add-mask::$value"
          done
          echo "All required secrets are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package

      # The Java SE image starts /home/site/wwwroot/app.jar, so the artifact is
      # renamed. The agent jar travels in the same package.
      - name: Assemble the deployment package
        run: |
          set -euo pipefail
          mkdir -p dist
          app_jar=$(find target -maxdepth 1 -name '*.jar' ! -name 'otel-javaagent.jar' ! -name '*-sources.jar' | head -1)
          if [ -z "$app_jar" ]; then
            echo "ERROR: application jar not found in target/" >&2
            exit 1
          fi
          if [ ! -f target/otel-javaagent.jar ]; then
            echo "ERROR: target/otel-javaagent.jar not found. Check the maven-dependency-plugin execution." >&2
            exit 1
          fi
          cp "$app_jar" dist/app.jar
          cp target/otel-javaagent.jar dist/otel-javaagent.jar
          # startup.sh es el comando de arranque del App Service: adjunta el
          # agente solo si el jar esta presente, en vez de tumbar la JVM.
          cp startup.sh dist/startup.sh
          (cd dist && zip -q -r ../app.zip .)
          ls -la dist app.zip

      # Prints the exact "sub" claim that Azure has to match in the federated
      # credential. The repository name is not something you can choose: it is
      # whatever GitHub puts in the token. If the login below fails with
      # AADSTS70021, copy the value printed here into the federated credential.
      # Only the claims are printed, never the token.
      - name: Show the OIDC subject expected by Azure
        continue-on-error: true
        run: |
          set -euo pipefail
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "::add-mask::${token}"

          payload=$(echo "$token" | cut -d. -f2)
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          claims=$(echo "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null)

          subject=$(echo "$claims" | jq -r .sub)
          echo "$claims" | jq '{sub, repository, repository_id, repository_owner, ref, workflow}'

          {
            echo "### OIDC subject of this run"
            echo
            echo '```'
            echo "$subject"
            echo '```'
            echo
            echo "This is the exact value the federated credential must carry in its \`subject\` field."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      # ---------------------------------------------------------------------
      # Infrastructure
      # ---------------------------------------------------------------------
      - name: Deploy infrastructure
        id: infra
        env:
          SQL_ADMIN_USER: ${{ secrets.SQL_ADMIN_USER }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          NR_LICENSE_KEY: ${{ secrets.NR_LICENSE_KEY }}
          OBSERVABILITY_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.observability_enabled || 'true' }}
        run: |
          set -euo pipefail
          # The .bicepparam file declares its own template through "using",
          # so --template-file must not be passed here.
          outputs=$(az deployment sub create \
            --name "users-${GITHUB_RUN_ID}" \
            --location "$AZURE_LOCATION" \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json)

          echo "webapp_name=$(echo "$outputs" | jq -r .webAppName.value)" >> "$GITHUB_OUTPUT"
          echo "webapp_url=$(echo "$outputs" | jq -r .webAppUrl.value)" >> "$GITHUB_OUTPUT"
          echo "workspace_name=$(echo "$outputs" | jq -r .logAnalyticsWorkspaceName.value)" >> "$GITHUB_OUTPUT"
          echo "sql_fqdn=$(echo "$outputs" | jq -r .sqlServerFqdn.value)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Application
      # ---------------------------------------------------------------------
      # Reads the settings back from the running app and fails if any of them
      # does not match what was just deployed. This catches the case where a
      # changed GitHub secret or variable does not reach the web app.
      - name: Verify the effective application settings
        env:
          APP: ${{ steps.infra.outputs.webapp_name }}
        run: |
          set -euo pipefail
          settings=$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP" -o json)

          check() {
            local name="$1" expected="$2"
            local actual
            actual=$(echo "$settings" | jq -r --arg n "$name" '.[] | select(.name==$n) | .value')
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: ${name} is '${actual}' but '${expected}' was deployed" >&2
              return 1
            fi
            echo "  ${name} = ${actual}"
          }

          echo "Effective settings:"
          check ENVIRONMENT "$ENVIRONMENT"
          check OTEL_SERVICE_NAME "$OTEL_SERVICE_NAME"
          check LOG_LEVEL "$LOG_LEVEL"
          check SQL_LOG_LEVEL "$SQL_LOG_LEVEL"
          check OTEL_EXPORTER_OTLP_ENDPOINT "$NR_OTLP_ENDPOINT"
          check SQL_DATABASE "$SQL_DATABASE_NAME"
          echo "Every checked setting matches the deployed value."

      # --track-status polls the runtime status of the app after uploading and
      # can hang for a Java app that takes a while to boot. The readiness of
      # the app is verified right after by the health smoke test instead.
      - name: Deploy the application package
        timeout-minutes: 20
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ steps.infra.outputs.webapp_name }}" \
            --src-path app.zip \
            --type zip \
            --restart true \
            --clean true \
            --track-status false \
            --timeout 900

      # A restart guarantees the app picks up any setting changed in this run,
      # even when the package itself did not change.
      - name: Restart the web app
        run: |
          set -euo pipefail
          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ steps.infra.outputs.webapp_name }}"

      # ---------------------------------------------------------------------
      # Smoke tests over HTTPS
      # ---------------------------------------------------------------------
      - name: Smoke test - health endpoint
        env:
          URL: ${{ steps.infra.outputs.webapp_url }}
        run: |
          set -euo pipefail
          echo "Waiting for ${URL}/actuator/health ..."
          for attempt in $(seq 1 40); do
            body=$(curl --silent --show-error --max-time 15 "${URL}/actuator/health" || true)
            if echo "$body" | grep -q '"status":"UP"'; then
              echo "Application is healthy after ${attempt} attempt(s)."
              echo "$body"
              exit 0
            fi
            echo "  not ready yet, retrying in 15s ..."
            sleep 15
          done
          echo "ERROR: the application never reported status UP." >&2
          echo "Last response: ${body}" >&2
          exit 1

      - name: Smoke test - TLS and anonymous access
        env:
          URL: ${{ steps.infra.outputs.webapp_url }}
        run: |
          set -euo pipefail
          host="${URL#https://}"

          # The certificate chain is validated: no --insecure anywhere.
          curl --silent --show-error --output /dev/null "https://${host}/actuator/health"
          echo "Certificate chain validated."

          # httpsOnly redirects plain HTTP.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://${host}/actuator/health")
          echo "Plain HTTP returned ${code}"
          case "$code" in
            30*) echo "HTTP is redirected to HTTPS, as expected." ;;
            200) echo "ERROR: the application answered over plain HTTP" >&2; exit 1 ;;
            *) echo "Unexpected status ${code} over plain HTTP" ;;
          esac

          # The business endpoints must reject anonymous traffic.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' "${URL}/users")
          echo "/users without credentials returned ${code}"
          if [ "$code" != "401" ]; then
            echo "ERROR: /users should reject anonymous requests" >&2
            exit 1
          fi

      - name: Smoke test - authenticated call reaches the database
        env:
          URL: ${{ steps.infra.outputs.webapp_url }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user "${BASIC_AUTH_USER}:${BASIC_AUTH_PASSWORD}" "${URL}/users")
          echo "GET /users with credentials returned ${code}"
          if [ "$code" != "200" ]; then
            echo "ERROR: the authenticated call failed. The database link is probably broken." >&2
            exit 1
          fi
          echo "The application queried Azure SQL successfully."

      - name: Deployment summary
        if: always()
        env:
          URL: ${{ steps.infra.outputs.webapp_url }}
          APP: ${{ steps.infra.outputs.webapp_name }}
          WORKSPACE: ${{ steps.infra.outputs.workspace_name }}
          SQL_FQDN: ${{ steps.infra.outputs.sql_fqdn }}
        run: |
          {
            echo "## microservice-users deployed"
            echo
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| URL | ${URL} |"
            echo "| Web app | ${APP} |"
            echo "| Resource group | ${AZURE_RESOURCE_GROUP} |"
            echo "| SQL server | ${SQL_FQDN} |"
            echo "| Log Analytics workspace | ${WORKSPACE} |"
            echo "| App Service SKU | ${APP_SERVICE_SKU} |"
            echo "| SQL SKU | ${SQL_SKU_NAME} |"
            echo
            echo "Remember to run the destroy workflow when the PoC is over."
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Automatic cleanup, so a forgotten PoC does not keep billing
  # -------------------------------------------------------------------------
  auto-destroy:
    name: Automatic cleanup
    needs: deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_destroy_minutes != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:

      - name: Wait for the configured TTL
        env:
          MINUTES: ${{ inputs.auto_destroy_minutes }}
        run: |
          set -euo pipefail
          echo "Waiting ${MINUTES} minute(s) before deleting ${AZURE_RESOURCE_GROUP}."
          sleep "$(( MINUTES * 60 ))"

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete the resource group
        run: |
          set -euo pipefail
          echo "Deleting resource group ${AZURE_RESOURCE_GROUP}"
          az group delete --name "$AZURE_RESOURCE_GROUP" --yes
          echo "Resource group deleted."
